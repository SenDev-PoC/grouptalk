[project]
name = "grouptalk-livekit-worker"
version = "0.1.0"
description = "GroupTalk LiveKit Agents worker"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "aiohttp>=3.12,<4",
  "httpx>=0.28,<1",
  "livekit-agents~=1.5",
  "pydantic-settings>=2.7,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grouptalk_livekit_worker"]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
